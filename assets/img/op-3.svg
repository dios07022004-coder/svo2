<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Портрет оператора">
  <defs>
    <radialGradient id="bgop3" cx="32%" cy="22%" r="86%">
      <stop offset="0" stop-color="#7a613f"/><stop offset="1" stop-color="#4b3922"/>
    </radialGradient>
    <linearGradient id="skop3" x1="0.25" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e8b98d"/><stop offset="1" stop-color="#d19c6c"/>
    </linearGradient>
    <linearGradient id="hop3" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3c2c20"/><stop offset="1" stop-color="#2a1f17"/>
    </linearGradient>
    <linearGradient id="unop3" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#514c3a"/><stop offset="1" stop-color="#3c382a"/>
    </linearGradient>
    <clipPath id="clop3"><circle cx="48" cy="48" r="48"/></clipPath>
  </defs>

  <g clip-path="url(#clop3)">
    <rect width="96" height="96" fill="url(#bgop3)"/>

    <!-- китель -->
    <path d="M-2 96c0-14 9-23 21-27l29-9 29 9c12 4 21 13 21 27z" fill="url(#unop3)"/>
    <!-- воротник-стойка и лацканы -->
    <path d="M31 71l17 14 17-14 8 3-25 20-25-20z" fill="#332f24"/>
    <path d="M38 66c3 6 6 10 10 12 4-2 7-6 10-12l-10-4z" fill="#d19c6c" opacity=".9"/>
    <!-- блик на плече -->
    <path d="M4 96c1-9 5-15 12-19v19z" fill="#ffffff" opacity=".08"/>
    <!-- погон -->
    <rect x="73" y="80" width="15" height="4" rx="2" fill="#c8912a"/>
    <rect x="73" y="87.5" width="11" height="3.6" rx="1.8" fill="#c8912a" opacity=".65"/>

    <!-- шея -->
    <path d="M39 52h18v17c0 6-18 6-18 0z" fill="url(#skop3)"/>
    <path d="M39 59c5 4 13 4 18 0v-7H39z" fill="#b8845b" opacity=".55"/>

    <!-- уши -->
    <ellipse cx="27" cy="40" rx="3.6" ry="4.8" fill="url(#skop3)"/>
    <ellipse cx="69" cy="40" rx="3.6" ry="4.8" fill="url(#skop3)"/>
    <path d="M27 38c1 1 1 3 0 4" stroke="#b8845b" stroke-width="1" fill="none" opacity=".7"/>
    <path d="M69 38c-1 1-1 3 0 4" stroke="#b8845b" stroke-width="1" fill="none" opacity=".7"/>

    <!-- голова с намеченной челюстью -->
    <path d="M27 35c0-12 9-21 21-21s21 9 21 21v5c0 13-9 23-21 23S27 53 27 40z" fill="url(#skop3)"/>
    <path d="M48 58c-8 0-15-5-18-13 2 11 9 18 18 18s16-7 18-18c-3 8-10 13-18 13z" fill="#b8845b" opacity=".28"/>
    <!-- скулы -->
    <ellipse cx="36" cy="43" rx="4" ry="2.6" fill="#b8845b" opacity=".22"/>
    <ellipse cx="60" cy="43" rx="4" ry="2.6" fill="#b8845b" opacity=".22"/>
    <path d="M28 41c0 13 9 23 20 23s20-10 20-23c1 11-1 19-6 24-4 4-9 6-14 6s-10-2-14-6c-5-5-7-13-6-24z" fill="#2a1f17"/><path d="M40 55c2.6 2 12.4 2 15 0-2 4-5 6-7.5 6S42 59 40 55z" fill="#000000" opacity=".18"/>
    <path d="M26 43c-1-5-1-10 0-14C28 18 36 12 48 12s20 6 22 17c1 4 1 9 0 14-1-6-2-10-4-13-4 4-10 6-18 6-7 0-12 1-15 4-3 3-5 6-7 3z" fill="url(#hop3)"/><path d="M33 21c4-4 9-6 15-6-6 1-11 3-15 6z" fill="#ffffff" opacity=".18"/>

    <!-- глаза -->
    <g>
      <ellipse cx="39.5" cy="38.5" rx="4" ry="2.9" fill="#ffffff" opacity=".95"/>
      <ellipse cx="56.5" cy="38.5" rx="4" ry="2.9" fill="#ffffff" opacity=".95"/>
      <circle cx="40" cy="38.6" r="2.3" fill="#3d2f22"/>
      <circle cx="56" cy="38.6" r="2.3" fill="#3d2f22"/>
      <circle cx="40" cy="38.6" r="1.1" fill="#1d1712"/>
      <circle cx="56" cy="38.6" r="1.1" fill="#1d1712"/>
      <circle cx="40.9" cy="37.6" r="0.7" fill="#ffffff"/>
      <circle cx="56.9" cy="37.6" r="0.7" fill="#ffffff"/>
    </g>
    <!-- веки -->
    <path d="M35.5 36.4c2.6-1.8 5.9-1.8 8.4 0" stroke="#b8845b" stroke-width="1.1" fill="none" opacity=".65" stroke-linecap="round"/>
    <path d="M52.1 36.4c2.6-1.8 5.9-1.8 8.4 0" stroke="#b8845b" stroke-width="1.1" fill="none" opacity=".65" stroke-linecap="round"/>
    <!-- брови -->
    <g stroke="url(#hop3)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M34.6 31.6c2.8-1.9 6.4-1.9 9.2-.2"/>
      <path d="M52.2 31.4c2.8-1.7 6.4-1.7 9.2.2"/>
    </g>
    <!-- нос и рот -->
    <path d="M46.3 43c1.2 1.2 2.2 1.2 3.4 0" stroke="#b8845b" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <path d="M42.4 49.6c3.6 2.8 7.6 2.8 11.2 0" stroke="#b8845b" stroke-width="2.1" stroke-linecap="round" fill="none"/>
